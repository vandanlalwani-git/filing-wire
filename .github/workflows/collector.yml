name: Collector

# Fetches BSE and NSE filings, classifies them with fixed rules (no AI),
# saves the record book to the `data` branch and publishes the website.
#
# Runs every 5 minutes on GitHub's free schedule (often 5-30 minutes late).
# Backfill: run it by hand with "backfill from" / "backfill to" filled in.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (normal), quick or full"
        type: choice
        options: [auto, quick, full]
        default: auto
      with_yesterday:
        description: "Full run also rebuilds yesterday"
        type: boolean
        default: false
      backfill_from:
        description: "Backfill start YYYY-MM-DD (leave empty for a normal run)"
        type: string
        default: ""
      backfill_to:
        description: "Backfill end YYYY-MM-DD"
        type: string
        default: ""
      refetch_from:
        description: "One-time re-read of past days to add stored text, start YYYY-MM-DD"
        type: string
        default: ""
      refetch_to:
        description: "Re-read end YYYY-MM-DD"
        type: string
        default: ""
      repair_from:
        description: "Re-pair past days after a rule change, start YYYY-MM-DD (no downloads)"
        type: string
        default: ""
      repair_to:
        description: "Re-pair end YYYY-MM-DD"
        type: string
        default: ""
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes; GitHub often runs these late

permissions:
  contents: write       # push the data branch
  pages: write          # publish the website
  id-token: write       # required by the Pages deploy action
  actions: write        # the watchdog cancels a run that never got a machine

jobs:
  # On 5 Oct 2026 a run's job waited 2 hours for a GitHub machine that never
  # came, and every run queued behind it was replaced, so the feed stopped.
  # A job timeout cannot catch that (it only starts counting on a machine),
  # so every run first checks: if the run holding the queue has had no
  # machine for 15 minutes and no other run is working, cancel it.
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # also catches a job left "waiting" on the Pages environment (seen 6 Oct 2026,
      # it blocked every later run for an hour)
      - name: Cancel a run stuck without a machine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          now=$(date +%s)
          jobs=$(for id in $(for st in in_progress queued waiting; do gh api "repos/$GITHUB_REPOSITORY/actions/workflows/collector.yml/runs?status=$st&per_page=30" --jq '.workflow_runs[].id'; done); do
                   [ "$id" = "$GITHUB_RUN_ID" ] && continue
                   gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                     --jq ".jobs[] | select(.name==\"collect\" and .status!=\"completed\") | [\"$id\", .status, (.runner_name // \"\"), .created_at] | @tsv"
                 done)
          echo "${jobs:-no other collect job in progress}"
          # a collect job that has a machine is real work (e.g. a long backfill): leave everything alone
          if echo "$jobs" | awk -F'\t' '$3 != ""' | grep -q .; then exit 0; fi
          echo "$jobs" | awk -F'\t' '$2=="queued" || $2=="in_progress" || $2=="waiting"' | sort -t$'\t' -k4 | head -1 | \
          while IFS=$'\t' read -r id status runner created; do
            age=$(( now - $(date -d "$created" +%s) ))
            if [ "$age" -gt 900 ]; then
              echo "::warning::Cancelling run $id: its job has waited ${age}s without a machine and is blocking the queue"
              gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
            fi
          done

  collect:
    runs-on: ubuntu-latest
    # Never two collect jobs at once: they would fight over the data branch.
    concurrency:
      group: collector
      cancel-in-progress: false
    # A normal run takes about 1 minute, a busy full run about 2, and the
    # worst case (full day of BSE pages + 2 minutes of PDFs) about 5.
    # 10 minutes is well above that, and short enough that a hung run frees
    # the queue within two timer ticks. Backfill/re-read/repair runs read
    # many days and get 45.
    timeout-minutes: ${{ (inputs.backfill_from || inputs.refetch_from || inputs.repair_from) && 45 || 10 }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Load the record book from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            timeout 120 git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
            echo "loaded $(find data -type f | wc -l) files"
          else
            echo "no data branch yet - starting an empty record book"
          fi

      - name: Collect
        id: collect
        timeout-minutes: ${{ (inputs.backfill_from || inputs.refetch_from || inputs.repair_from) && 40 || 7 }}
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          WITH_YESTERDAY: ${{ inputs.with_yesterday && 'yes' || '' }}
          BF_FROM: ${{ inputs.backfill_from }}
          BF_TO: ${{ inputs.backfill_to }}
          RF_FROM: ${{ inputs.refetch_from }}
          RF_TO: ${{ inputs.refetch_to }}
          RP_FROM: ${{ inputs.repair_from }}
          RP_TO: ${{ inputs.repair_to }}
        run: |
          set +e
          if [ -n "$RF_FROM" ]; then
            python run.py --data-dir data --refetch "$RF_FROM" "${RF_TO:-$RF_FROM}"
          elif [ -n "$RP_FROM" ]; then
            python run.py --data-dir data --repair "$RP_FROM" "${RP_TO:-$RP_FROM}"
          elif [ -n "$BF_FROM" ]; then
            python run.py --data-dir data --backfill "$BF_FROM" "${BF_TO:-$BF_FROM}"
          elif [ -n "$WITH_YESTERDAY" ]; then
            python run.py --data-dir data --mode "$MODE" --with-yesterday
          else
            python run.py --data-dir data --mode "$MODE"
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 fine (one exchange may be down - recorded in status.json)
          # 2 both exchanges failed      -> publish, then fail the run
          # 3 backfill paused on errors  -> publish, then fail the run
          # anything else: the code crashed -> stop here, publish nothing
          case $code in 0|2|3) exit 0 ;; *) exit $code ;; esac

      - name: Check nothing private is about to be published
        run: python run.py --data-dir data --check-public

      - name: Save the record book (one commit, replaces the last)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Record book $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          # the branch only ever moves to a complete new commit: a push that is
          # cut off leaves the previous record book in place
          timeout 120 git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
          echo "data branch: $(git rev-list --count HEAD) commit"

      # The screen only needs rebuilding when its own code changes; otherwise
      # the last build is reused, so a 5-minute run doesn't redo it each time.
      - name: Reuse the screen build if its code is unchanged
        id: webcache
        uses: actions/cache@v4
        with:
          path: web/dist
          key: screen-${{ hashFiles('web/package-lock.json', 'web/index.html', 'web/vite.config.js', 'web/src/**') }}

      - uses: actions/setup-node@v4
        if: steps.webcache.outputs.cache-hit != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the screen
        if: steps.webcache.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the website
        run: python build_site.py --data-dir data --out site --app web/dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report a failure if both exchanges were down
        if: steps.collect.outputs.code == '2' || steps.collect.outputs.code == '3'
        run: |
          if [ "${{ steps.collect.outputs.code }}" = "2" ]; then
            echo "::error::Both BSE and NSE failed this run. Existing data was kept and published."
          else
            echo "::error::Backfill paused because an exchange returned errors. Run it again later to resume."
          fi
          exit 1
